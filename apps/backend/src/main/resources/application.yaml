server:
  port: ${SERVER_PORT:8080}
  tomcat:
    encoded-solidus-handling: decode

spring:
  application:
    name: linkedin-scraper-backend
  datasource:
    url: jdbc:sqlite:${SQLITE_FILE:../../data/linkedin-scraper.sqlite}
    driver-class-name: org.sqlite.JDBC
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
